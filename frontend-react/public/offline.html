<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Smart Delivery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { color: #333; font-size: 24px; margin-bottom: 12px; }
        p { color: #666; font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            background: #D2691E;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #b85e1a; }
        .features {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #eee;
            text-align: left;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            color: #555;
            font-size: 14px;
        }
        .feature .emoji { font-size: 20px; }
        .offline-indicator {
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="offline-indicator">📡 OFFLINE</div>
        <div class="icon">📡</div>
        <h1>Você está offline</h1>
        <p>Parece que você perdeu a conexão com a internet. Não se preocupe, você pode continuar navegando pelo cardápio que já foi carregado.</p>
        <button class="btn" onclick="window.location.reload()">🔄 Tentar novamente</button>
        <div class="features">
            <h3 style="margin-bottom: 12px; color: #333; font-size: 14px;">✏️ Disponível offline:</h3>
            <div class="feature"><span class="emoji">📋</span><span>Visualizar cardápio</span></div>
            <div class="feature"><span class="emoji">🛒</span><span>Ver itens do carrinho</span></div>
            <div class="feature"><span class="emoji">📦</span><span>Acompanhar pedidos</span></div>
        </div>
    </div>
    <script>
        window.addEventListener('online', () => {
            document.querySelector('.container').innerHTML = `
                <div style="padding: 20px 0;">
                    <div style="font-size: 48px;">🎉</div>
                    <h2 style="margin-top: 16px;">Conexão restaurada!</h2>
                    <p style="margin-top: 8px;">Recarregando a página...</p>
                </div>
            `;
            setTimeout(() => window.location.reload(), 1500);
        });
    </script>
</body>
</html>
