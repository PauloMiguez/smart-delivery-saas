<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Smart Delivery SaaS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e67e22, #d35400);
        }
        .register-container {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
        }
        .register-container h1 {
            color: #e67e22;
            text-align: center;
            margin-bottom: 24px;
        }
        .register-container .form-group {
            margin-bottom: 14px;
        }
        .register-container .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            color: #555;
        }
        .register-container .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .register-container .form-group input:focus {
            outline: none;
            border-color: #e67e22;
        }
        .register-container .btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
        }
        .register-container .login-link {
            text-align: center;
            margin-top: 16px;
            color: #888;
        }
        .register-container .login-link a {
            color: #e67e22;
            text-decoration: none;
            font-weight: 600;
        }
        .register-container .login-link a:hover {
            text-decoration: underline;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>🚀 Criar Conta</h1>
        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Nome do Restaurante *</label>
                <input type="text" id="reg-tenant-name" placeholder="Fire Burger" required>
            </div>
            <div class="form-group">
                <label>Subdomínio *</label>
                <input type="text" id="reg-subdomain" placeholder="firerburger" required>
                <small style="color:#888;font-size:12px;">Ex: firerburger.smartdelivery.com</small>
            </div>
            <div class="form-group">
                <label>Seu Nome *</label>
                <input type="text" id="reg-name" placeholder="Seu nome completo" required>
            </div>
            <div class="form-group">
                <label>E-mail *</label>
                <input type="email" id="reg-email" placeholder="contato@firerburger.com" required>
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="text" id="reg-phone" placeholder="(85) 99999-9999">
            </div>
            <div class="form-group">
                <label>Senha *</label>
                <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <button type="submit" class="btn">Criar Conta</button>
        </form>
        <div class="login-link">
            Já tem uma conta? <a href="login.html">Faça login</a>
        </div>
    </div>
    <div class="toast-container" id="toast-container"></div>

    <script>
        const API_URL = window.location.origin + '/api';

        async function handleRegister(event) {
            event.preventDefault();
            
            // Capturar os valores do formulário
            const restaurantName = document.getElementById('restaurant-name').value.trim();
            const subdomain = document.getElementById('subdomain').value.trim();
            const ownerName = document.getElementById('owner-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            // Validar campos obrigatórios
            if (!restaurantName || !subdomain || !ownerName || !email || !password) {
                showToast('Preencha todos os campos obrigatórios.', 'warning');
                return;
            }

            if (password.length < 6) {
                showToast('A senha deve ter no mínimo 6 caracteres.', 'warning');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        restaurantName,
                        subdomain,
                        ownerName,
                        email,
                        phone,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao cadastrar');
                }

                if (data.success) {
                    // Salvar token e tenant
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('tenant', data.data.tenantId);
                    sessionStorage.setItem('tenant', data.data.tenantId);
                    
                    showToast('Restaurante cadastrado com sucesso!', 'success');
                    
                    // Redirecionar para o admin
                    setTimeout(() => {
                        window.location.href = '/admin?tenant=' + data.data.tenantId;
                    }, 1500);
                }
            } catch (error) {
                console.error('❌ Erro no registro:', error);
                showToast(error.message, 'error');
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const icons = { success: '✅', error: '❌', warning: '⚠️' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || '📢'}</span>
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => { if (toast.parentElement) toast.remove(); }, 300);
            }, 3500);
        }

        if (localStorage.getItem('token')) {
            window.location.href = '/admin';
        }
    </script>
</body>
</html>
